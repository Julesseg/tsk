#screen{position:relative}.mast{padding-top:9px}.mast h2{font-size:37px}.heading{min-height:48px}.heading .subtle{font-size:14px}.top{min-height:30px}.top .subtle{min-height:38px}.mast .info{margin-top:5px}
.collections{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 17px 10px}.collection{display:flex;align-items:center;gap:7px;min-height:46px;text-align:left;padding:0 11px;font-size:14px;font-weight:600;background:#eef1e9;border-radius:12px}.collection svg{width:17px;color:var(--leaf)}.collection small{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}
.dock{flex:none;position:relative;display:grid;place-items:center;padding:7px 0 4px;background:linear-gradient(0deg,#fbfcf8 60%,#fbfcf800);min-height:56px}.pill{background:linear-gradient(160deg,#fcfdf9f7,#edf2e8f2);backdrop-filter:blur(16px);border:1px solid #b8c3b0;border-radius:24px;box-shadow:inset 0 1px 0 white,0 2px 8px #2834211c;font-size:14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:0 16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pill svg{width:14px;height:14px;transform:rotate(180deg)}.pill[aria-expanded=true] svg{transform:none}.dock .library{position:absolute;left:8px;bottom:4px;min-height:44px;padding:0 6px;display:grid;place-content:center;justify-items:center;gap:1px;font-weight:550;font-size:10px;color:var(--leaf)}.library svg{width:17px;height:17px}
.shade{background:#26322219}.shade.calendar{padding:0 9px 4px;justify-content:center}.calbody{width:100%;max-width:336px;background:linear-gradient(155deg,#fffffcfa,#edf2e7f7);backdrop-filter:blur(15px);border:1px solid #b7c1ad;border-radius:23px;box-shadow:0 6px 20px #26341c26;padding:6px 9px 0;text-align:center;animation:reveal .16s ease-out;transform-origin:bottom}.calbody .pill{box-shadow:none;background:none;border:0;min-height:43px}.calbody .between{padding:0 1px}.calbody .flat{background:none}.calbody .month button{min-height:31px;font-size:14px}.month button.today{box-shadow:inset 0 0 0 1px #718868}.calbody .collections{padding:8px 0;border-top:1px solid var(--line);margin-top:6px}.calbody .collection{background:#e3eadc;min-height:40px}.calbody .jump{font-size:12px;color:var(--leaf);font-weight:600;min-height:30px}.calbody .intent{font-size:15px;margin:8px 0 0}.calbody .month{touch-action:pan-y}.sheet .sheetline{min-height:46px}.sheet .picktime{display:flex;gap:7px;align-items:center;justify-content:space-between;font-size:14px;margin:8px 0}

</style></head><body>
<main><article id="phone" aria-label="Interactive tsk iPhone prototype"><div class="status" aria-hidden="true"><span>9:41</span><span class="signals"><svg viewBox="0 0 14 10" style="width:14px;height:10px;fill:currentColor;stroke:none"><path d="M0 8h2v2H0zM4 6h2v4H4zM8 3h2v7H8zM12 0h2v10h-2z"/></svg><svg viewBox="0 0 14 10" style="width:14px;height:10px"><path d="M1 3q6-5 12 0M3.5 5.5q3.5-3 7 0M6 8q1-.8 2 0"/></svg><i class="battery"></i></span></div><div id="screen"></div><div class="home"></div></article>
<aside><div class="identity">tsk <span>/ Date pill prototype</span></div><h1 class="variantname"></h1><p id="description"></p><button data-do="calendar">Open the date pill</button><button data-do="demo">Try selecting two tasks</button><button data-do="reset">Reset example</button></aside></main>
<nav class="switchwrap" aria-label="Prototype variants"><div class="switcher"><button data-do="prev" aria-label="Previous variant">←</button><strong id="variant" aria-live="polite"></strong><button data-do="next" aria-label="Next variant">→</button></div></nav>
<script>
const variants={
  D:['Planner shortcuts','Inbox and Projects sit under the day heading. Open either in one tap, then return to the same day. The bottom edge belongs to the date pill.'],
  E:['Expanded calendar','Open the date pill to find Inbox and Projects below the month. Both shortcuts disappear when the calendar is scheduling selected tasks.'],
  F:['Library drawer','A small Library button at the lower left opens a drawer. Switch workspaces without opening the calendar or reaching for the title.']
};
const order=Object.keys(variants);
const spaces=['Planner','Inbox','Projects'];
const icons={Library:'M3 4h5v16H3z M10 4h4v16h-4z M16 5l3-1 3 15-3 1z',Planner:'M4 5h16v16H4z M4 10h16 M8 3v5 M16 3v5',Inbox:'M3 12l3-7h12l3 7v7H3z M3 13h5l2 3h4l2-3h5',Projects:'M2.5 7V5h7l2 2h10v12h-19z',add:'M12 5v14 M5 12h14',check:'m5 12 4.5 4.5L19 7',right:'m9 5 7 7-7 7',left:'m15 5-7 7 7 7',down:'m6 9 6 6 6-6',Deadline:'M5 21V4 M5 5c5-4 9 4 14 0v9c-5 4-9-4-14 0',Scheduled:'M4 5h16v16H4z M4 10h16 M8 3v5 M16 3v5 M8 15h4',Complete:'M20 12a8 8 0 1 1-4-7 M8 11l4 4 8-9'};
const icon=name=>'<svg aria-hidden="true" viewBox="0 0 24 24"><path d="'+icons[name]+'"/></svg>';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(action,html,cls='',extra='')=>'<button class="'+cls+'" data-do="'+action+'" '+extra+'>'+html+'</button>';
const today='2026-11-21';
const dateObj=key=>new Date(key+'T12:00:00');
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function offset(key,n){const d=dateObj(key);d.setDate(d.getDate()+n);return dateKey(d)}
const fmt=(key,opts)=>dateObj(key).toLocaleDateString('en-US',opts);
const short=key=>fmt(key,{month:'short',day:'numeric'});
const seeds=[
  ['Send the print proofs','Field notes',today],['Pick up the film rolls','',today],['Review the contact sheet','Field notes',today,'11:30'],
  ['Book a table for Friday','',today,'16:00'],['Return the borrowed lens','Studio',today],['Pack the tripod','Field notes',offset(today,1)],
  ['Order more envelopes','',''],['Call the frame shop','',''],['Scan the negatives','Studio','']
];
function sample(){return seeds.map(([title,project,scheduled,time],id)=>({id,title,project,scheduled,time,deadline:'',done:false}))}
let key=new URLSearchParams(location.search).get('variant');if(!variants[key])key='D';
let tasks,space,day,project,selection,selected,changes,modal,month,edit,draft,notice;
function reset(){tasks=sample();space='Planner';day=today;project=null;endSelect();modal='';edit=null;draft='';notice=''}
function endSelect(){selection=false;selected=new Set();changes={}}
function visible(){return tasks.filter(t=>space==='Planner'?(t.scheduled||t.deadline)===day:space==='Inbox'?!t.done&&!t.scheduled&&!t.project:!t.done&&t.project===project)}
const projectNames=()=>['',...new Set(tasks.map(t=>t.project).filter(Boolean).sort())];
const projectName=p=>p||'No project';
function navigate(name){space=name;project=null;modal='';endSelect();notice=''}
function dayTitle(){return day===today?'Today':fmt(day,{weekday:'long'})}
function title(){return space==='Planner'?dayTitle():space==='Projects'&&project!==null?projectName(project):space}
function editing(){return edit!==null}
function save(){if(!editing())return;const name=draft.trim();if(name&&edit==='new')tasks.unshift({id:Math.max(...tasks.map(t=>t.id))+1,title:name,project:space==='Projects'?project||'':'',scheduled:space==='Planner'&&day>=today?day:'',deadline:'',done:false});else if(name)tasks.find(t=>t.id===edit).title=name;edit=null;draft=''}
function editor(){return '<form class="draft"><input id="draft" aria-label="Task title" maxlength="150" placeholder="Task title" value="'+esc(draft)+'"><button class="action" type="submit">Save</button></form>'}
function taskRow(t){if(edit===t.id)return editor();const marked=selection?selected.has(t.id):t.done;
  const meta=[t.project,t.deadline?'Due '+short(t.deadline):''].filter(Boolean).join(' · ');
  const circle='<span class="circle '+(marked?'marked':'')+'">'+(marked?icon('check'):'')+'</span>';
  const content='<span class="taskcopy"><span class="taskname">'+esc(t.title)+'</span>'+(meta?'<span class="meta">'+esc(meta)+'</span>':'')+'</span>'+(space==='Planner'&&t.time?'<span class="time">'+t.time+'</span>':'');
  if(selection)return btn('task-'+t.id,circle+content,'row','aria-pressed="'+selected.has(t.id)+'" '+(t.done?'disabled':''));
  return '<div class="row '+(t.done?'done':'')+'" data-task="'+t.id+'">'+btn('toggle-'+t.id,circle,'rowcheck','aria-label="'+(t.done?'Reopen ':'Complete ')+esc(t.title)+'"')+btn('task-'+t.id,content,'rowbody')+'</div>';
}
function list(){
  if(space==='Projects'&&project===null)return '<div class="scroll">'+projectNames().map((p,i)=>btn('folder-'+i,icon('Projects')+esc(projectName(p))+'<span class="tail">'+tasks.filter(t=>!t.done&&t.project===p).length+'</span>'+icon('right'),'folder')).join('')+'</div>';
  const rows=visible(),timed=rows.filter(t=>t.time).sort((a,b)=>a.time.localeCompare(b.time));
  const event=day===today?'<div class="event"><span class="taskcopy"><span class="taskname">Studio check-in</span><span class="meta">Calendar · Studio</span></span><span class="time">10:00</span></div>':'';
  let content=space==='Planner'?rows.filter(t=>!t.time).map(taskRow).join('')+((timed.length||event)?'<div class="group">Timeline</div>'+event+timed.map(taskRow).join(''):''):rows.map(taskRow).join('');
  return '<div class="scroll">'+(edit==='new'?editor():'')+(!rows.length&&!editing()?'<p class="empty">No tasks here.</p>':'')+content+'</div>'
}

function collections(){
  const counts={Inbox:tasks.filter(t=>!t.done&&!t.project&&!t.scheduled).length,Projects:projectNames().length-1};
  return '<nav class="collections" aria-label="Workspaces">'+['Inbox','Projects'].map(s=>btn('go-'+s,icon(s)+s+'<small>'+counts[s]+'</small>','collection')).join('')+'</nav>'
}
function mast(){
  const folder=space==='Projects'&&project!==null, canSelect=space!=='Projects'||folder;
  const back=folder?btn('projects',icon('left')+'Projects','inline subtle'):space!=='Planner'?btn('go-Planner',icon('left')+'Planner','inline subtle'):'<span></span>';
  const top=selection?btn('cancel','Cancel','subtle')+btn('edits','Edit tasks','subtle',selected.size?'':'disabled'):back+(canSelect&&visible().some(t=>!t.done)?btn('select','Select','subtle'):'<span></span>');
  return '<div class="top">'+top+'</div><header class="mast"><div class="kicker">'+(space==='Planner'?fmt(day,{weekday:'long',month:'long',day:'numeric'}):space==='Projects'&&folder?'Project':'Workspace')+'</div><div class="heading"><h2 class="title '+(selection?'selectiontitle':'')+'">'+(selection?selected.size+' selected':esc(title()))+'</h2>'+(selection?'':btn('add',icon('add')+' New task','inline subtle'))+'</div></header>'
}
function pill(expanded){
  const label=selection?'Schedule '+selected.size:fmt(day,{weekday:'short',month:'short',day:'numeric'});
  return btn(expanded?'close':'calendar',label+icon('down'),'pill','aria-label="'+(selection?'Schedule selected tasks':expanded?'Close calendar':'Browse date')+'" aria-expanded="'+expanded+'" '+(selection&&!selected.size?'disabled':''));
}
function footer(){return '<div class="dock">'+(key==='F'&&!selection?btn('library',icon('Library')+'Library','library'):'')+(modal==='calendar'?'':pill(false))+'</div>'}
function calendarGrid(){
  const d=dateObj(month);d.setDate(1);const skip=(d.getDay()+6)%7,n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const active=modal==='calendar'?(selection?'':day):changes[modal]?.date;
  return '<div class="between">'+btn('earlier',icon('left'),'flat','aria-label="Previous month"')+'<strong>'+fmt(month,{month:'long',year:'numeric'})+'</strong>'+btn('later',icon('right'),'flat','aria-label="Next month"')+'</div><div class="month">'+['M','T','W','T','F','S','S'].map(w=>'<span>'+w+'</span>').join('')+'<i></i>'.repeat(skip)+Array.from({length:n},(_,i)=>{const val=offset(dateKey(d),i);return btn('pick-'+val,i+1,[val===active?'on':'',val===today?'today':''].join(' '),'aria-label="'+short(val)+'" '+(modal==='calendar'&&selection&&val<today?'disabled':''))}).join('')+'</div>'
}
function picker(){
  if(!modal)return '';
  if(modal==='calendar')return '<div class="shade calendar"><section class="calbody" role="dialog" aria-label="'+(selection?'Schedule tasks':'Calendar')+'">'+(selection?'<h3 class="intent">Choose a day to schedule '+selected.size+'</h3>':'')+calendarGrid()+(!selection?btn('pick-'+today,'Go to Today','jump'):'')+(key==='E'&&!selection?collections():'')+'<div>'+pill(true)+'</div></section></div>';
  if(modal==='library')return '<div class="shade drawer"><nav class="panel" aria-label="Library"><div class="between"><h3>Library</h3>'+btn('close','Close','subtle')+'</div>'+spaces.map(s=>btn('go-'+s,icon(s)+s+'<span class="tail">'+icon(space===s?'check':'right')+'</span>','indexbtn')).join('')+'</nav></div>';
  const editingField=modal!=='edits';
  let body=editingField?calendarGrid()+'<label class="picktime">Time (optional)<input type="time" id="time" value="'+(changes[modal]?.time||'')+'"></label>'+btn('clear','Remove date','pick subtle')+btn('unchange','Leave unchanged','pick subtle'):['Scheduled','Deadline','Complete'].map(f=>{const c=changes[f],label=c===undefined?'Unchanged':c===null?'Remove':c===true?'Yes':short(c.date)+(c.time?' · '+c.time:'');return btn('field-'+f,icon(f)+f+'<span class="tail">'+label+'</span>','sheetline')}).join('')+btn('apply','Apply changes','action',Object.keys(changes).length?'':'disabled');
  return '<div class="shade"><section class="sheet" role="dialog"><div class="between"><h3>'+(editingField?modal:'Edit '+selected.size+' selected')+'</h3>'+btn(editingField?'fields':'close',editingField?'Done':'Cancel','subtle')+'</div>'+body+'</section></div>';
}
const screen=document.querySelector('#screen');
function render(){
  screen.innerHTML=mast()+(space==='Planner'&&!selection&&key==='D'?collections():'')+list()+(notice?'<div class="notice" role="status">'+esc(notice)+'</div>':'')+footer()+picker();
  document.querySelector('#variant').textContent=key+' · '+variants[key][0];document.querySelector('.variantname').textContent=variants[key][0];document.querySelector('#description').textContent=variants[key][1];
  if(editing()){const input=document.querySelector('#draft');input?.focus();if(input)input.setSelectionRange(input.value.length,input.value.length)}
}
function browse(d){navigate('Planner');day=d}
function handleDate(date){
  if(modal!=='calendar'){changes[modal]={date,time:document.querySelector('#time')?.value||''};return}
  if(!selection){browse(date);return}
  if(date<today||!selected.size)return;
  for(const t of tasks.filter(t=>selected.has(t.id))){t.scheduled=date;t.time=''}
  notice='Scheduled '+selected.size+' for '+short(date);endSelect();modal='';
}
function apply(){
  for(const t of tasks.filter(t=>selected.has(t.id))){
    for(const [f,v] of Object.entries(changes)){if(f==='Complete')t.done=true;else if(f==='Scheduled'){t.scheduled=v?.date||'';t.time=v?.time||''}else{t.deadline=v?.date||'';t.deadlineTime=v?.time||''}}
  }
  notice='Updated '+selected.size+' tasks';endSelect();modal='';
}
function cycle(delta){key=order[(order.indexOf(key)+delta+3)%3];if(modal==='library')modal='';const url=new URL(location.href);url.searchParams.set('variant',key);try{history.replaceState({},'',url)}catch{}render()}
function action(a){
  if(a==='prev'||a==='next'){cycle(a==='prev'?-1:1);return}
  if(editing())save();notice='';
  if(a==='reset')reset();
  else if(a==='calendar'){if(selection&&!selected.size)return;modal='calendar';month=selection&&day<today?today:day}
  else if(a==='close'){if(modal==='edits')changes={};modal=''}
  else if(a==='select')selection=true;
  else if(a==='cancel')endSelect();
  else if(a==='demo'){if(visible().filter(t=>!t.done).length<2||space==='Projects'&&project===null)browse(today);selection=true;selected=new Set(visible().filter(t=>!t.done).slice(0,2).map(t=>t.id));changes={};modal=''}
  else if(a==='library')modal='library';
  else if(a.startsWith('go-'))navigate(a.slice(3));
  else if(a==='projects')project=null;
  else if(a.startsWith('folder-'))project=projectNames()[Number(a.slice(7))];
  else if(a==='add'){if(space==='Projects'&&project===null)project='';edit='new';draft=''}
  else if(a.startsWith('day-'))browse(a.slice(4));
  else if(a.startsWith('pick-'))handleDate(a.slice(5));
  else if(a==='earlier'||a==='later'){const d=dateObj(month);d.setDate(1);d.setMonth(d.getMonth()+(a==='later'?1:-1));month=dateKey(d)}
  else if(a==='edits'||a==='fields')modal='edits';
  else if(a.startsWith('field-')){const f=a.slice(6);if(f==='Complete'){if(changes.Complete)delete changes.Complete;else changes.Complete=true}else{modal=f;month=changes[f]?.date||day}}
  else if(a==='clear'||a==='unchange'){if(a==='clear')changes[modal]=null;else delete changes[modal];modal='edits'}
  else if(a==='apply')apply();
  else if(a.startsWith('toggle-')){const t=tasks.find(t=>t.id===Number(a.slice(7)));t.done=!t.done}
  else if(a.startsWith('task-')){const id=Number(a.slice(5));if(selection){if(selected.has(id))selected.delete(id);else selected.add(id)}else{edit=id;draft=tasks.find(t=>t.id===id).title}}
  render()
}
let hold,heldUntil=0;
document.addEventListener('pointerdown',e=>{const row=e.target.closest('.row');if(!row||selection||row.classList.contains('done'))return;hold=setTimeout(()=>{selection=true;selected.add(Number(row.dataset.task));heldUntil=Date.now()+700;render()},500)});
for(const type of ['pointerup','pointercancel','pointermove'])document.addEventListener(type,e=>{if(type!=='pointermove'||Math.abs(e.movementX)+Math.abs(e.movementY)>4)clearTimeout(hold)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.row,.pill'))e.preventDefault()});
document.addEventListener('input',e=>{if(e.target.id==='draft')draft=e.target.value;if(e.target.id==='time'){changes[modal]??={date:day,time:''};changes[modal].time=e.target.value}});
document.addEventListener('submit',e=>{e.preventDefault();save();render()});
document.addEventListener('click',e=>{if(e.target.closest('.draft')||Date.now()<heldUntil)return;const target=e.target.closest('[data-do]');if(target)action(target.dataset.do);else if(e.target.classList.contains('shade'))action('close');else if(editing()){save();render()}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='Escape'&&modal){action('close');return}if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
let swipe;
screen.addEventListener('touchstart',e=>{if(space==='Planner'&&!selection&&!editing()&&!modal&&e.target.closest('.scroll'))swipe=e.touches[0]},{passive:true});
screen.addEventListener('touchcancel',()=>{swipe=null});
screen.addEventListener('touchend',e=>{if(!swipe)return;const dx=e.changedTouches[0].clientX-swipe.clientX,dy=e.changedTouches[0].clientY-swipe.clientY;swipe=null;if(!selection&&Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy)){heldUntil=Date.now()+350;action('day-'+offset(day,dx<0?1:-1))}},{passive:true});

let contact=null,pillHold;
screen.addEventListener('pointerdown',e=>{
  const target=e.target.closest('.pill,.calbody .month');if(!target)return;
  const inGrid=target.classList.contains('month');
  contact={id:e.pointerId,x:e.clientX,y:e.clientY,grid:inGrid,expanded:modal==='calendar'};
  if(!inGrid){if(target.hasPointerCapture(e.pointerId)||e.isTrusted)target.setPointerCapture(e.pointerId);if(!modal&&!selection)pillHold=setTimeout(()=>{if(contact){heldUntil=Date.now()+850;action('day-'+today);contact=null}},520)}
});
screen.addEventListener('pointermove',e=>{if(contact&&Math.hypot(e.clientX-contact.x,e.clientY-contact.y)>7)clearTimeout(pillHold)});
screen.addEventListener('pointercancel',()=>{contact=null;clearTimeout(pillHold)});
screen.addEventListener('pointerup',e=>{
  clearTimeout(pillHold);if(!contact||contact.id!==e.pointerId)return;
  const {x,y,grid,expanded}=contact;contact=null;
  const dx=e.clientX-x,dy=e.clientY-y;if(Math.max(Math.abs(dx),Math.abs(dy))<26)return;
  const horizontal=Math.abs(dx)>Math.abs(dy);
  heldUntil=Date.now()+300;
  if(horizontal&&(grid||expanded))action(dx<0?'later':'earlier');
  else if(horizontal&&!selection)action('day-'+offset(day,dx<0?1:-1));
  else if(!horizontal&&expanded&&dy>0)action('close');
  else if(!horizontal&&!expanded&&dy<0)action('calendar')
});
reset();render()
</script></body></html>
