name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Run only the existing diagnostic iPhone lane
        type: boolean
        required: false
        default: false
      native_index_control:
        description: Run only the independent disposable Core Spotlight control
        type: boolean
        required: false
        default: false

# The one project-specific value in this workflow. Must match the name of the
# Xcode project/scheme on disk (App/<APP_NAME>.xcodeproj) — scripts/rename.sh
# keeps them in sync.
env:
  APP_NAME: Tsk

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.native_index_control && format('ci-native-index-control-{0}', github.ref) || github.event_name == 'workflow_dispatch' && format('ci-dispatch-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  dispatch-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject conflicting diagnostic modes
        env:
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          NATIVE_INDEX_CONTROL: ${{ inputs.native_index_control }}
        run: |
          if [[ "$DIAGNOSTIC_ONLY" == "true" && "$NATIVE_INDEX_CONTROL" == "true" ]]; then
            echo 'Choose diagnostic_only OR native_index_control, not both.' >&2
            exit 64
          fi

  core-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.diagnostic_only && !inputs.native_index_control) }}
    name: Core · swift test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Install standard C++ development headers
        run: apt-get update && apt-get install -y g++
      - name: Run Core tests
        working-directory: Core
        run: swift test

  native-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.diagnostic_only && !inputs.native_index_control) }}
    name: TaskChampion · persistent replica (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          apt-get update
          apt-get install -y curl gcc g++ sqlite3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Native/Bridge

      - name: Build native bridge and exercise persistent Core flows
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-native.sh host
          swift build --package-path Native --product tsk-native-probe
          TSK_NATIVE_PROBE_BINARY="$(swift build --package-path Native --show-bin-path)/tsk-native-probe" \
            TSK_TASKCHAMPION_LIBRARY="$PWD/Native/Bridge/target/release/libtsk_taskchampion.so" swift test --package-path Native

  native-index-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_index_control }}
    needs: dispatch-inputs
    name: Core Spotlight · Independent native control
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Validate control ownership and workflow contracts
        run: python3 scripts/native-index-control/test_runner.py
      - name: Run four sequential owned native controls
        run: python3 scripts/native-index-control/runner.py --output .build/native-index-control
      - name: Upload bounded control receipts and command logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-index-control
          path: |
            .build/native-index-control/**/*.json
            .build/native-index-control/*.log
          if-no-files-found: ignore

  app-ui-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_index_control }}
    name: ${{ matrix.job-name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.diagnostic_only && '[{"family":"iPhone","job-name":"App · Diagnostic UI boundaries (iPhone)","artifact":"ui-diagnostic-boundaries","diagnostic":true}]' || '[{"family":"iPhone","job-name":"App · XCUITest (macOS)","artifact":"ui-test-results"},{"family":"iPad","job-name":"App · XCUITest (iPad)","artifact":"ui-test-results-ipad"},{"family":"iPhone","job-name":"App · Diagnostic UI boundaries (iPhone)","artifact":"ui-diagnostic-boundaries","diagnostic":true}]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@1.99.0

      - name: Check out pinned real TaskChampion sync server
        uses: actions/checkout@v4
        with:
          repository: GothenburgBitFactory/taskchampion-sync-server
          ref: d206729d5ea7421d501b60111a7b40ecc2ddb87f
          path: .build/sync-server
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Native/Bridge
            .build/sync-server

      - name: Build pinned TaskChampion for iOS
        run: scripts/build-native.sh apple

      - name: Build the real isolated synchronization fixture and independent peer
        run: |
          cargo build --locked --release --manifest-path .build/sync-server/Cargo.toml --package taskchampion-sync-server --bin taskchampion-sync-server
          scripts/build-native.sh host
          swift build --package-path Native --product tsk-native-probe

      - name: Run Calendar controller regressions
        timeout-minutes: 5
        run: TSK_TASKCHAMPION_LIBRARY="$PWD/Native/Bridge/target/release/libtsk_taskchampion.dylib" swift test --package-path App/ControllerTests

      - name: Validate target-specific release profile rules
        run: python3 scripts/test-provisioning-profiles.py

      - name: Toolchain versions
        run: xcodebuild -version

      - name: Resolve an available ${{ matrix.family }} simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json | python3 -c '
          import json, os, subprocess, sys
          devices = json.load(sys.stdin)["devices"]
          available = [(runtime, device) for runtime, entries in devices.items() for device in entries if device["name"].startswith(os.environ["DEVICE_FAMILY"])]
          runtime, device = max(available, key=lambda item: (item[0], "13-inch" in item[1]["name"] or "12.9-inch" in item[1]["name"], "Pro" in item[1]["name"], item[1]["name"]))
          identifier = subprocess.check_output(["xcrun", "simctl", "create", "tsk isolated " + os.environ["DEVICE_FAMILY"], device["deviceTypeIdentifier"], runtime], text=True).strip()
          print("Created isolated simulator: " + device["name"] + " (" + identifier + ")")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("id=" + identifier + "\n")
          '

      - name: Build & run UI tests
        working-directory: App
        run: |
          set -o pipefail
          export TEST_RUNNER_TSK_UI_ISOLATED_SIMULATOR=1
          export TSK_EVENTKIT_EVIDENCE_DIR="$PWD/../.build/eventkit-fixture"
          coverage=()
          if [[ "${{ matrix.diagnostic }}" == "true" ]]; then
            coverage=(-only-testing:TskUITests/ShareCaptureUITests -only-testing:TskUITests/CustomViewsUITests -only-testing:TskUITests/TaskAnnotationUITests -only-testing:TskUITests/MissedNotificationUITests -only-testing:TskUITests/SynchronizationUITests/testSuccessfulManualSynchronizationUsesRealConfiguredServer -only-testing:TskUITests/ReminderImportUITests/testRealEventKitCopyAndRecurrenceFixturePreserveSourcesAndDurableTasks -only-testing:TskUITests/ReminderRecurrenceUITests/testActualCurrentWeeklyCopyCreatesDurableTemplateAndPreservesCompletedSourceHistory -only-testing:TskUITests/SpotlightUITests -only-testing:TskUITests/WidgetUITests)
          elif [[ "${{ matrix.family }}" == "iPad" ]]; then
            coverage=(-only-testing:TskUITests/ShareCaptureUITests -only-testing:TskUITests/SynchronizationUITests -only-testing:TskUITests/iPadWorkspaceUITests -only-testing:TskUITests/TaskAnnotationUITests -only-testing:TskUITests/TaskAutomationUITests -only-testing:TskUITests/RecurringTemplateUITests -only-testing:TskUITests/SeriesMetadataUITests -only-testing:TskUITests/SeriesTransitionUITests -only-testing:TskUITests/TaskAttributeUITests -only-testing:TskUITests/TypedFilterUITests -only-testing:TskUITests/ReminderImportUITests -only-testing:TskUITests/ContinuousReminderImportUITests -only-testing:TskUITests/TaskActivityUITests -only-testing:TskUITests/ReminderRecurrenceUITests -only-testing:TskUITests/CalendarTodayUITests -only-testing:TskUITests/WidgetUITests -only-testing:TskUITests/SpotlightUITests -only-testing:TskUITests/TaskNotificationUITests -only-testing:TskUITests/MissedNotificationUITests)
          fi
          peer=(--verify-peer "$(swift build --package-path ../Native --show-bin-path)/tsk-native-probe")
          export TSK_TASKCHAMPION_LIBRARY="$PWD/../Native/Bridge/target/release/libtsk_taskchampion.dylib"
          python3 ../scripts/with-sync-fixture.py \
            --server ../.build/sync-server/target/release/taskchampion-sync-server \
            --output ../.build/ui-sync "${peer[@]}" -- \
            ../scripts/run-ui-tests.sh "${{ steps.sim.outputs.id }}" \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" "${coverage[@]}" \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath ../.build/ui \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Verify simulator intent metadata and shared storage entitlement
        run: python3 scripts/verify-intents-artifact.py ".build/ui/Build/Products/Debug-iphonesimulator/$APP_NAME.app"

      - name: Remove owned isolated simulator
        if: ${{ always() && steps.sim.outputs.id != '' }}
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.id }}" || true
          xcrun simctl delete "${{ steps.sim.outputs.id }}"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            App/TestResults.xcresult
            App/TestResults-sharing.xcresult
            .build/ui-sync
            .build/eventkit-fixture
          if-no-files-found: ignore
