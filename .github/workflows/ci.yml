name: Standalone Spotlight diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-spotlight:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One native index and exact UUID query
        run: python3 scripts/diagnostics/run-spotlight-minimal.py
      - name: Final owned-device cleanup
        if: always()
        shell: python
        run: |
          import json, pathlib, subprocess
          manifest = pathlib.Path('.build/spotlight-minimal/owned-device.json')
          if manifest.exists():
              device = json.loads(manifest.read_text())['id']
              state = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '--json'], text=True))
              owned = [d for entries in state['devices'].values() for d in entries if d['udid'] == device]
              if owned:
                  if owned[0]['state'] != 'Shutdown':
                      subprocess.run(['xcrun', 'simctl', 'shutdown', device], check=True, timeout=60)
                  subprocess.run(['xcrun', 'simctl', 'delete', device], check=True, timeout=60)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-spotlight
          path: .build/spotlight-minimal
          include-hidden-files: true
