name: CI
run-name: CI · ${{ inputs.diagnostic_only && 'diagnostic' || github.event_name == 'schedule' && 'full' || inputs.ui_suite || 'smoke' }} · ${{ inputs.reason || github.event_name }}

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ui_suite:
        description: UI coverage to run
        type: choice
        options: [smoke, full, keyboard, text, regression, menu]
        required: true
        default: smoke
      reason:
        description: Why this coverage is needed
        type: string
        required: true
        default: Manual verification
      expected_sha:
        description: Frozen source SHA supplied by the dispatch helper
        type: string
        required: false
      diagnostic_only:
        description: Run only the existing diagnostic iPhone lane
        type: boolean
        required: false
        default: false

# The one project-specific value in this workflow. Must match the name of the
# Xcode project/scheme on disk (App/<APP_NAME>.xcodeproj) — scripts/rename.sh
# keeps them in sync.
env:
  APP_NAME: Tsk

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["keyboard","text","regression","menu"]'), inputs.ui_suite) && format('ci-{0}-{1}', inputs.ui_suite, github.ref) || github.event_name == 'workflow_dispatch' && format('ci-dispatch-{0}-{1}', inputs.diagnostic_only && 'diagnostic' || inputs.ui_suite, github.ref) || github.event_name == 'schedule' && format('ci-scheduled-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    name: Test routing
    runs-on: ubuntu-24.04
    outputs:
      run_tests: ${{ steps.route.outputs.run_tests }}
      matrix: ${{ steps.plan.outputs.matrix }}
      families: ${{ steps.plan.outputs.families }}
      partitions: ${{ steps.plan.outputs.partitions }}
      suite: ${{ steps.plan.outputs.suite }}
      server: ${{ steps.plan.outputs.server }}
      peer: ${{ steps.plan.outputs.peer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan UI coverage and fixture requirements
        id: plan
        env:
          UI_SUITE: ${{ inputs.diagnostic_only && 'diagnostic' || github.event_name == 'schedule' && 'full' || inputs.ui_suite || 'smoke' }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/plan-ui-tests.py "$UI_SUITE"

      - name: Verify test routing
        run: |
          python3 scripts/test-ci-test-routing.py
          python3 scripts/test-sorted-migration.py
          python3 scripts/test-agent-dispatch.py
          python3 scripts/test-agent-hooks.py
          python3 scripts/test-ui-test-lease.py
          python3 scripts/test-remote-ios.py
          python3 scripts/test-create-ui-test-simulator.py
          python3 scripts/test-ui-test-selection.py
          python3 scripts/test-ui-shard-checks.py
          python3 scripts/test-ci-execution.py
          python3 scripts/test-native-test-selection.py
          python3 scripts/test-native-keyboard-hid-installer.py
          python3 scripts/test-native-keyboard-hid-relay.py
          python3 scripts/test-native-keyboard-hid-owner.py
          python3 scripts/test-native-keyboard-boundary-cleanup.py
      - name: Classify changed paths
        id: route
        run: python3 scripts/ci-test-routing.py

  core-tests:
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only) }}
    name: Core · swift test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Install standard C++ development headers
        run: apt-get update && apt-get install -y g++
      - uses: actions/cache@v4
        with:
          path: Core/.build
          key: core-swift-6.0.3-linux-${{ hashFiles('Core/Package.swift', 'Core/Sources/**', 'Core/Tests/**') }}
          restore-keys: core-swift-6.0.3-linux-
      - name: Run Core tests
        working-directory: Core
        run: swift test

  native-tests:
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only) }}
    name: TaskChampion · persistent replica (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Native test prerequisites and pinned Rust toolchain
        run: |
          apt-get update
          apt-get install -y curl gcc g++ sqlite3 cmake uuid-dev git python3
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          repository: GothenburgBitFactory/taskchampion-sync-server
          ref: d206729d5ea7421d501b60111a7b40ecc2ddb87f
          path: .build/sync-server
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Native/Bridge
            .build/sync-server
      - uses: actions/cache@v4
        with:
          path: .build/taskwarrior/build
          key: taskwarrior-3.5.0-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('scripts/build-taskwarrior-fixture.sh') }}

      - uses: actions/cache@v4
        with:
          path: |
            Native/.build
            Core/.build
          key: native-swift-6.0.3-linux-${{ hashFiles('Native/Package.swift', 'Native/Sources/**', 'Native/Tests/**', 'Core/Package.swift', 'Core/Sources/**', 'Core/Tests/**', 'Native/Bridge/Cargo.*', 'Native/Bridge/src/**') }}
          restore-keys: native-swift-6.0.3-linux-
      - name: Build pinned Native test fixtures
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-native.sh host
          cargo build --locked --release --manifest-path .build/sync-server/Cargo.toml --package taskchampion-sync-server --bin taskchampion-sync-server
          bash scripts/build-taskwarrior-fixture.sh
          swift build --package-path Native --product tsk-native-probe
      - name: Run persistent and Taskwarrior conformance tests with isolated synchronization
        run: |
          TSK_TASKCHAMPION_LIBRARY="$PWD/Native/Bridge/target/release/libtsk_taskchampion.so" \
            python3 scripts/run-native-tests.py --target TskNativeTests \
              --server .build/sync-server/target/release/taskchampion-sync-server \
              --taskwarrior .build/taskwarrior-install/bin/task \
              --probe "$(swift build --package-path Native --show-bin-path)/tsk-native-probe" \
              --output .build/native-test-results
          LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test --package-path Native --filter SpotlightQueryReaderTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-results
          path: .build/native-test-results
          retention-days: 7
          include-hidden-files: true

  ui-build:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    name: App · Shared UI products
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      RUN_NATIVE_TESTS: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only }}
    outputs:
      artifact_id: ${{ steps.products.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify migration conversion and offline EventKit helper
        run: python3 scripts/test-sorted-migration.py
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Check out pinned real TaskChampion sync server
        if: needs.changes.outputs.server == 'true' || env.RUN_NATIVE_TESTS == 'true'
        uses: actions/checkout@v4
        with:
          repository: GothenburgBitFactory/taskchampion-sync-server
          ref: d206729d5ea7421d501b60111a7b40ecc2ddb87f
          path: .build/sync-server
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Native/Bridge
            ${{ (needs.changes.outputs.server == 'true' || env.RUN_NATIVE_TESTS == 'true') && '.build/sync-server' || '' }}
      - uses: actions/cache@v4
        if: env.RUN_NATIVE_TESTS == 'true'
        with:
          path: .build/taskwarrior/build
          key: taskwarrior-3.5.0-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('scripts/build-taskwarrior-fixture.sh') }}
      - name: Build native runtime and selected synchronization tools
        env:
          NEED_SERVER: ${{ needs.changes.outputs.server == 'true' || env.RUN_NATIVE_TESTS == 'true' }}
          NEED_PEER: ${{ needs.changes.outputs.peer == 'true' || env.RUN_NATIVE_TESTS == 'true' }}
        run: |
          scripts/build-native.sh simulator
          scripts/build-native.sh host
          mkdir -p .build/ui-tools
          cp Native/Bridge/target/release/libtsk_taskchampion.dylib .build/ui-tools/
          if [[ "$NEED_SERVER" == true ]]; then
            cargo build --locked --release --manifest-path .build/sync-server/Cargo.toml --package taskchampion-sync-server --bin taskchampion-sync-server
            cp .build/sync-server/target/release/taskchampion-sync-server .build/ui-tools/
          fi
          if [[ "$NEED_PEER" == true ]]; then
            swift build --package-path Native --product tsk-native-probe
            cp "$(swift build --package-path Native --show-bin-path)/tsk-native-probe" .build/ui-tools/
          fi
      - name: Run Apple-framework Native tests
        if: env.RUN_NATIVE_TESTS == 'true'
        timeout-minutes: 10
        run: |
          bash scripts/build-taskwarrior-fixture.sh
          TSK_TASKCHAMPION_LIBRARY="$PWD/.build/ui-tools/libtsk_taskchampion.dylib" \
            python3 scripts/run-native-tests.py --target TskNativeAppleTests \
              --server .build/ui-tools/taskchampion-sync-server \
              --taskwarrior .build/taskwarrior-install/bin/task \
              --probe .build/ui-tools/tsk-native-probe --output .build/native-apple-results
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_NATIVE_TESTS == 'true'
        with:
          name: native-apple-results
          path: .build/native-apple-results
          retention-days: 7
          include-hidden-files: true
      - name: Run Calendar controller regressions
        timeout-minutes: 5
        run: TSK_TASKCHAMPION_LIBRARY="$PWD/.build/ui-tools/libtsk_taskchampion.dylib" swift test --package-path App/ControllerTests
      - name: Validate target-specific release profile rules
        run: python3 scripts/test-provisioning-profiles.py
      - name: Build UI test products
        id: ui_build
        timeout-minutes: 20
        working-directory: App
        run: |
          xcodebuild build-for-testing \
            -project "$APP_NAME.xcodeproj" -scheme "$APP_NAME" \
            -destination 'generic/platform=iOS Simulator' \
            -parallel-testing-enabled NO -derivedDataPath ../.build/ui \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES TSK_APP_DEBUG_DYLIB=NO
      - name: Verify simulator intent metadata and shared storage entitlement
        id: admission
        run: python3 scripts/verify-intents-artifact.py ".build/ui/Build/Products/Debug-iphonesimulator/$APP_NAME.app"
      - name: Retain rejected UI build admission evidence
        if: failure() && steps.ui_build.outcome == 'success' && steps.admission.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ui-build-admission-diagnostics
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/ui/Build/Products/Debug-iphonesimulator/${{ env.APP_NAME }}.app
            .build/ui/Build/Intermediates.noindex/${{ env.APP_NAME }}.build/Debug-iphonesimulator/${{ env.APP_NAME }}.build/Objects-normal/arm64/${{ env.APP_NAME }}_dependency_info.dat
            .build/ui/Build/Intermediates.noindex/${{ env.APP_NAME }}.build/Debug-iphonesimulator/${{ env.APP_NAME }}.build/Objects-normal/arm64/${{ env.APP_NAME }}.SwiftConstValuesFileList
            .build/ui/Build/Intermediates.noindex/${{ env.APP_NAME }}.build/Debug-iphonesimulator/${{ env.APP_NAME }}.build/${{ env.APP_NAME }}.DependencyMetadataFileList
            .build/ui/Build/Intermediates.noindex/${{ env.APP_NAME }}.build/Debug-iphonesimulator/${{ env.APP_NAME }}.build/${{ env.APP_NAME }}.DependencyStaticMetadataFileList
      - name: Package signed products and execution identity
        run: python3 scripts/ui-build-products.py pack --archive .build/ui-products.tar.gz
      - uses: actions/upload-artifact@v4
        id: products
        with:
          name: ui-products
          path: |
            .build/ui-products.tar.gz
            .build/ui-products.tar.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: ui-execution-identity
          path: .build/ui-products.tar.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  app-ui-test-shards:
    needs: [changes, ui-build]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.run_tests == 'false' || needs.ui-build.result == 'success') }}
    name: App · UI shard (${{ matrix.family }}, ${{ matrix.partition }})
    runs-on: ${{ needs.changes.outputs.run_tests == 'true' && 'xcode-27' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ needs.changes.outputs.suite == 'full' && 165 || needs.changes.outputs.suite == 'smoke' && 60 || 90 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix || '{"include":[{"family":"iPhone","partition":"all"}]}') }}
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.run_tests == 'false'
        run: echo 'Documentation-only change; no Xcode runner, build or simulator required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_tests == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: needs.changes.outputs.run_tests == 'true'
        with:
          xcode-version: "27.0"
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.run_tests == 'true'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.run_tests == 'true'
        with:
          artifact-ids: ${{ needs.ui-build.outputs.artifact_id }}
          path: .build
          merge-multiple: true
      - name: Verify source, toolchain, runtime and signed products
        if: needs.changes.outputs.run_tests == 'true'
        run: python3 scripts/ui-build-products.py unpack --archive .build/ui-products.tar.gz
      - name: Install pinned native keyboard transport
        if: needs.changes.outputs.run_tests == 'true' && matrix.native_keyboard
        run: python3 scripts/install-native-keyboard-hid.py --root "$PWD/.build/native-keyboard-hid"
      - name: Resolve an available ${{ matrix.family }} simulator
        if: needs.changes.outputs.run_tests == 'true'
        id: sim
        run: python3 scripts/create-ui-test-simulator.py --family "${{ matrix.family }}"
      - name: Run prebuilt UI tests
        if: needs.changes.outputs.run_tests == 'true'
        timeout-minutes: ${{ needs.changes.outputs.suite == 'full' && 150 || needs.changes.outputs.suite == 'smoke' && 45 || 60 }}
        working-directory: App
        env:
          UI_SUITE: ${{ needs.changes.outputs.suite }}
          UI_FAMILY: ${{ matrix.family }}
          UI_PARTITION: ${{ matrix.partition }}
        run: /bin/bash ../scripts/run-ui-worker.sh "${{ steps.sim.outputs.id }}"
      - name: Summarize UI execution
        if: needs.changes.outputs.run_tests == 'true' && always()
        run: python3 scripts/summarize-ui-execution.py --family "${{ matrix.family }}" --partition "${{ matrix.partition }}" --suite "${{ needs.changes.outputs.suite }}"
      - name: Remove owned isolated simulator
        if: needs.changes.outputs.run_tests == 'true' && always() && steps.sim.outputs.id != ''
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.id }}" || true
          xcrun simctl delete "${{ steps.sim.outputs.id }}"
      - name: Upload test results
        if: needs.changes.outputs.run_tests == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.diagnostic_only && 'ui-diagnostic-boundaries' || format('{0}{1}', 'ui-test-results', matrix.partition == 'row-editing' && '-row-editing' || '') }}
          path: |
            App/TestResults.xcresult
            App/TestResults-sharing.xcresult
            .build/ui-sync
            .build/eventkit-fixture
            .build/ui-execution.json
          include-hidden-files: true
          if-no-files-found: ignore

  app-ui-tests:
    needs: [changes, app-ui-test-shards]
    if: always()
    name: ${{ needs.changes.outputs.suite == 'diagnostic' && format('App · Diagnostic UI boundaries ({0})', matrix.family) || contains(fromJSON('["keyboard","text","regression","menu"]'), needs.changes.outputs.suite) && format('App · {0} diagnostics ({1})', needs.changes.outputs.suite == 'keyboard' && 'Keyboard' || needs.changes.outputs.suite == 'text' && 'Text' || needs.changes.outputs.suite == 'menu' && 'Menu' || 'Regression', matrix.family) || 'App · XCUITest (macOS)' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.changes.outputs.families || '["iPhone"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected UI shard
        env:
          GH_TOKEN: ${{ github.token }}
          UI_PARTITIONS: ${{ join(fromJSON(needs.changes.outputs.partitions || '["all"]'), ',') }}
        run: python3 scripts/check-ui-shards.py --run-id "$GITHUB_RUN_ID" --family "${{ matrix.family }}" --partitions "$UI_PARTITIONS"
