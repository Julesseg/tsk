name: Unblock dispatch

# Find `ready-for-agent` issues that are ready to work — either never blocked,
# or with a "## Blocked by" list that is now fully closed — and dispatch an
# agent-implement run for each, up to an in-flight cap. Issues deferred by the
# cap are picked up automatically on the next run, because every run re-scans
# every open `ready-for-agent` issue.
#
# This workflow never labels an issue: the `agent-dispatched` label is applied
# by the session itself, so it always means a session really started. Until
# then the spawn run it fires stands in for the label — see stillHolds() below.
# See docs/agents/auto-dispatch.md.

on:
  issues:
    types: [closed]
  # Manual re-scan — the way to start never-blocked issues, drain a backlog
  # after raising the in-flight cap, or pick up a fixed "## Blocked by" list.
  workflow_dispatch:

# Serialize runs so two near-simultaneous events can't double-dispatch the
# same issue. A cancelled pending run is harmless: each run re-scans
# everything, so the surviving run covers the cancelled one's event.
concurrency:
  group: unblock-dispatch
  cancel-in-progress: false

permissions:
  issues: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAX_IN_FLIGHT = 3;
            const DISPATCH_LABEL = 'agent-dispatched';
            const READY_LABEL = 'ready-for-agent';
            const WORKFLOW_FILE = 'agent-implement.yml';
            // How long a successful spawn run keeps holding its issue: the gap
            // between the runner spawning the session and the session getting
            // far enough to label the issue itself.
            const HANDOFF_GRACE_MS = 30 * 60 * 1000;

            const { owner, repo } = context.repo;

            // The issue whose close unblocked this run — null on a manual
            // re-scan. Used only to credit the dispatch comment.
            let closedBy = null;
            if (context.payload.action === 'closed') {
              const closed = context.payload.issue;
              if (closed.state_reason !== 'completed') {
                core.info(`Issue #${closed.number} closed as "${closed.state_reason}"; not dispatching.`);
                return;
              }
              closedBy = closed;
            }

            // The session applies this label, but `gh issue edit --add-label`
            // fails on a label that does not exist, so create it here — ahead
            // of the session that will need it.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: DISPATCH_LABEL });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({
                owner, repo, name: DISPATCH_LABEL, color: '1d76db',
                description: 'An agent session has been dispatched for this issue',
              });
            }

            // Blockers are the "- #N" bullets under the "## Blocked by" heading.
            // No section, or one that says "None", yields [] — never blocked.
            function blockersOf(body) {
              const section = (body || '').split(/^## Blocked by\s*$/m)[1];
              if (!section) return [];
              const ownText = section.split(/^## /m)[0];
              return [...ownText.matchAll(/^\s*-\s*[\w./-]*#(\d+)/gm)].map(m => Number(m[1]));
            }

            // Umbrella issues a human slices into per-milestone work before any
            // agent grabs them: epics and specs.
            function isUmbrella(title) {
              return /^\[epic\]/i.test(title) || /^spec:/i.test(title);
            }

            const stateCache = new Map(closedBy ? [[closedBy.number, 'closed']] : []);
            async function isClosed(num) {
              if (!stateCache.has(num)) {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: num });
                stateCache.set(num, data.state);
              }
              return stateCache.get(num) === 'closed';
            }

            // agent-implement names its runs "Agent implement: issue #N".
            function issueOfRun(run) {
              const match = /issue #(\d+)/.exec(run.display_title || '');
              return match ? Number(match[1]) : null;
            }

            async function spawnRuns() {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: WORKFLOW_FILE, per_page: 50,
                });
                return data.workflow_runs;
              } catch (e) {
                if (e.status !== 404) throw e; // never dispatched before
                return [];
              }
            }

            // A spawn run holds its issue while a session may still come out
            // of it: queued (the Mac runner is asleep or busy) or in progress,
            // and for a grace period after it succeeds, which covers the gap
            // until the session labels the issue itself. A run that failed,
            // was cancelled, or expired unclaimed in the queue holds nothing —
            // no session started, so the issue is simply dispatched again.
            function stillHolds(run) {
              if (run.status !== 'completed') return true;
              if (run.conclusion !== 'success') return false;
              return Date.now() - Date.parse(run.updated_at) < HANDOFF_GRACE_MS;
            }

            // In flight = a session is working the issue (it carries the
            // label) or one is on its way (a spawn run still holds it).
            const inFlight = new Set();
            for (const issue of await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: DISPATCH_LABEL, per_page: 100,
            })) {
              inFlight.add(issue.number);
            }
            for (const run of await spawnRuns()) {
              const number = issueOfRun(run);
              if (number !== null && stillHolds(run)) inFlight.add(number);
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: READY_LABEL, per_page: 100,
            });

            const ready = [];
            for (const issue of open) {
              if (issue.pull_request) continue;
              if (inFlight.has(issue.number)) continue;
              if (isUmbrella(issue.title)) {
                core.info(`Skipping umbrella issue #${issue.number}: ${issue.title}`);
                continue;
              }
              const blockers = blockersOf(issue.body);
              let allClosed = true;
              for (const b of blockers) {
                if (!(await isClosed(b))) { allClosed = false; break; }
              }
              if (allClosed) ready.push({ issue, wasBlocked: blockers.length > 0 });
            }
            ready.sort((a, b) => a.issue.number - b.issue.number);

            if (ready.length === 0) {
              core.info('No dispatchable ready-for-agent issues.');
              return;
            }

            const slots = Math.max(0, MAX_IN_FLIGHT - inFlight.size);
            const toDispatch = ready.slice(0, slots);
            const deferred = ready.slice(slots);

            // createWorkflowDispatch returns no run id, and the run it creates
            // takes a moment to show up in the list. Wait for it: the next
            // dispatcher run reads those runs as its in-flight guard, and a
            // run it cannot see yet is an issue it would dispatch twice.
            const dispatchedAfter = Date.now() - 60 * 1000;
            async function waitForRun(number) {
              for (let attempt = 0; attempt < 10; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                const runs = await spawnRuns();
                if (runs.some(run => issueOfRun(run) === number
                                     && Date.parse(run.created_at) >= dispatchedAfter)) return;
              }
              core.warning(`No spawn run visible for #${number} yet; a re-scan in the next moments could dispatch it twice.`);
            }

            for (const { issue, wasBlocked } of toDispatch) {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: WORKFLOW_FILE,
                ref: context.payload.repository.default_branch,
                inputs: { issue: String(issue.number) },
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: wasBlocked && closedBy
                  ? `🤖 Unblocked by #${closedBy.number} — dispatched an agent session to implement this issue.`
                  : `🤖 Dispatched an agent session to implement this issue.`,
              });
              await waitForRun(issue.number);
              core.notice(`Dispatched #${issue.number}: ${issue.title}`);
            }
            for (const { issue } of deferred) {
              core.notice(`#${issue.number} is ready but deferred (in-flight cap ${MAX_IN_FLIGHT}); the next run will pick it up.`);
            }
