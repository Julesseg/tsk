[package]
name = "tsk-taskchampion"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
async-trait = "=0.1.92"
taskchampion = { version = "=3.1.0", default-features = false, features = ["storage-sqlite", "bundled", "server-sync", "tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
uuid = { version = "1", features = ["serde"] }
libc = "0.2"
url = "2"
